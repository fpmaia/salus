name: salus

x-db-env: &db-env
  DATABASE_URL: postgres://salus_app:${SALUS_APP_PASSWORD:-salus_app_dev}@db:5432/salus
  DATABASE_MIGRATOR_URL: postgres://salus_owner:${SALUS_OWNER_PASSWORD:-salus_owner_dev}@db:5432/salus
  APP_URL: ${APP_URL:-http://localhost:3000}
  LINKS_SECRET: ${LINKS_SECRET:-}
  SECRETS_KEY: ${SECRETS_KEY:-}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SALUS_OWNER_PASSWORD: ${SALUS_OWNER_PASSWORD:-salus_owner_dev}
      SALUS_APP_PASSWORD: ${SALUS_APP_PASSWORD:-salus_app_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: durante o init o Postgres só escuta no socket; TCP pronto = init concluído.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d salus"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:migrate"]
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment:
      <<: *db-env
      # Obrigatório em produção (o Better Auth recusa o segredo padrão).
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: tools
    command: ["npm", "run", "worker"]
    environment:
      <<: *db-env
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
