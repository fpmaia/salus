name: salus

x-db-env: &db-env
  DATABASE_URL: postgres://salus_app:${SALUS_APP_PASSWORD:-salus_app_dev}@db:5432/salus
  DATABASE_MIGRATOR_URL: postgres://salus_owner:${SALUS_OWNER_PASSWORD:-salus_owner_dev}@db:5432/salus
  APP_URL: ${APP_URL:-http://localhost:3000}
  # Segredos obrigatórios e distintos em produção (o app e o worker recusam subir sem eles; ver src/env.ts).
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-}
  LINKS_SECRET: ${LINKS_SECRET:-}
  SECRETS_KEY: ${SECRETS_KEY:-}
  ASAAS_AMBIENTE: ${ASAAS_AMBIENTE:-simulado}
  ASAAS_API_KEY: ${ASAAS_API_KEY:-}
  ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:-}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  EMAIL_FROM: ${EMAIL_FROM:-}
  TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
  IP_HEADER: ${IP_HEADER:-x-real-ip}
  WHATSAPP_PROVIDER: ${WHATSAPP_PROVIDER:-console}
  WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
  S3_ENDPOINT: ${S3_ENDPOINT:-http://s3:8333}
  S3_BUCKET: ${S3_BUCKET:-salus-anexos}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-salus}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-salus-s3-dev}
  S3_REGIAO: ${S3_REGIAO:-us-east-1}

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SALUS_OWNER_PASSWORD: ${SALUS_OWNER_PASSWORD:-salus_owner_dev}
      SALUS_APP_PASSWORD: ${SALUS_APP_PASSWORD:-salus_app_dev}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # -h 127.0.0.1: durante o init o Postgres só escuta no socket; TCP pronto = init concluído.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d salus"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Armazenamento de anexos do prontuário, compatível com S3 (SeaweedFS; o MinIO comunitário
  # foi descontinuado). Os arquivos chegam cifrados pela aplicação. Em produção, use S3/R2.
  s3:
    image: chrislusf/seaweedfs:4.48
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json"]
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    volumes:
      - s3data:/data
      - ./docker/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  migrate:
    build:
      context: .
      target: tools
    command: ["npm", "run", "db:migrate"]
    environment:
      <<: *db-env
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      target: runner
    environment:
      <<: *db-env
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3000}
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      target: tools
    command: ["npm", "run", "worker"]
    environment:
      <<: *db-env
      NODE_ENV: production
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  s3data:
