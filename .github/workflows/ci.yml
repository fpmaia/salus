name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TEST_DATABASE_URL: postgres://salus_app:salus_app_dev@localhost:5433/salus_test
      TEST_DATABASE_MIGRATOR_URL: postgres://salus_owner:salus_owner_dev@localhost:5433/salus_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Mesmo Postgres (e mesmo bootstrap de papéis) do desenvolvimento.
      - name: Subir Postgres
        run: docker compose up -d db --wait

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (unitários + integração com Postgres real)
        run: npm test

      - name: Build
        run: npm run build

      # E2E dos fluxos críticos sobre o build acima (next start na porta 3100, banco salus_test recriado).
      - name: Instalar Chromium (Playwright)
        run: npx playwright install --with-deps chromium

      - name: Testes E2E (Playwright)
        run: npm run test:e2e

      # Backup cifrado do salus_test (com os dados dos testes) e restauração num banco temporário.
      - name: Teste de backup e restauração
        run: sh scripts/testar-backup.sh

      - name: Compose de produção válido
        run: |
          cat > /tmp/producao.env <<'FIM'
          DOMINIO=app.exemplo.com.br
          ACME_EMAIL=a@b.c
          POSTGRES_PASSWORD=x
          SALUS_OWNER_PASSWORD=x
          SALUS_APP_PASSWORD=x
          BETTER_AUTH_SECRET=x
          LINKS_SECRET=x
          SECRETS_KEY=x
          RESEND_API_KEY=x
          EMAIL_FROM=x
          TURNSTILE_SITE_KEY=x
          TURNSTILE_SECRET_KEY=x
          S3_BUCKET=x
          S3_ACCESS_KEY=x
          S3_SECRET_KEY=x
          BACKUP_AGE_RECIPIENT=x
          BACKUP_DESTINO=x
          BACKUP_S3_ACCESS_KEY=x
          BACKUP_S3_SECRET_KEY=x
          SALUS_EMPRESA_NOME=x
          SALUS_EMPRESA_CNPJ=x
          SALUS_ENCARREGADO_EMAIL=x
          SENTRY_DSN=x
          FIM
          docker compose -f docker-compose.prod.yml --env-file /tmp/producao.env config --quiet

      - name: Relatório do Playwright
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Logs do Postgres
        if: failure()
        run: docker compose logs db
